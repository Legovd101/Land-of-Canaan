l_english:
 flavor_PRU.1.title: "Matters of Faith"
 flavor_PRU.1.desc: "REPLACE_ME"
 flavor_PRU.1.a: "The realm shall bend to my will."
 flavor_PRU.1.b: "I shall follow the wishes of my fellow Saka."
 flavor_PRU.1.c: "I shall follow the wishes of my subjects."
 flavor_PRU.1.d: "I just want to go home..."
 flavor_PRU.1.d.tt: "“I have failed you, my friend...”\n\n"
 collapse_of_baltudunne_tt: "\nGurgamoya will abandon his post to return to Huatana, and Baltudunne will collapse"

 flavor_PRU.2.title: "Lietuvan Nobles Elect their Own King!"
 flavor_PRU.2.desc: "REPLACE_ME"
 flavor_PRU.2.a: "I couldn't care less, let them go for all I care! Just leave me be!"
 flavor_PRU.2.b: "Wait, they *what* now? They can't do that, send in the army!"

 flavor_PRU.3.title: "Looking for a Wife"
 flavor_PRU.3.desc: "I have sent out the call across many neighboring realms that I am looking for a wife. After a wait, the candidates appear at my residence, with the line of potential spouses stretching from my door to the nearby courtyard. Two very long days later, I have sorted through the candidates, with three standing out to me above the others: A young Pussian girl related to a powerful chieftan, the daughter of a Lithuanian nobleman, and a daughter of my late friend Ugu.\n\n “I choose...”"
 flavor_PRU.3.a: "“...the Prussian girl”"
 flavor_PRU.3.b: "“...the Lithuanian woman”"
 flavor_PRU.3.c: "“...one of Ugu Jolobey's daughters”"
 flavor_PRU.3.d: "“...all three, in accordance with Prussian tradition!”"
 flavor_PRU.3.e: "From a nearby window, I see an older woman sitting in the grass... wait, is she *reading?*"
 who_is_she_tt: "“Who is this mysterious woman?”"
 will_leave_marriage_queue_tt: "\n§RI sneak out to investigate§!"
 flavor_PRU.4.title: "The Woman in the Grass"
 flavor_PRU.4.desc: "The woman introduces herself as Anna, and says that she was exiled from her homeland many years ago by the Sericans. Upon closer examination, the books scattered around her appear to be commentaries on philosophers from Pyrrho to Aristotle, with one of them abruptly ending mid-page. As we continue to talk, the woman speaks not with the air of a common housewife, but with that of an intellectual with years of practice in philosophy. The two of us continue to bounce off of each other as the day grows long, and yet neither of us tire of the other's company. By the gods, this woman would make a perfect spouse!"
 flavor_PRU.4.a: "A philosopher queen for a philosopher king."
 flavor_PRU.4.b: "“How would you like a seat at my table?”"
 flavor_PRU.4.c: "After an evening of delightful banter and philosophical debate, we part ways."
 anna_goes_home_tt: "Such an intelligent woman deserves not to be shackled with the trappings of power."
