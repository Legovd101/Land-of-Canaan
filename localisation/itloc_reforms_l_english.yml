l_english:
 serican_captaincy_reform: "Serican Captaincy"
 serican_captaincy_reform_desc: "Various Serican war bands and mercenaries were hired by emperor Kyros III in 1324 to subdue the Bithynian Kingdom, which threatened to march on Antioch. As a reward for shattering the realm, Kyros allowed the Sericans to settle in Anatolia, but they then refused to pay him his requested tribute, leading to the splintered region we see today."
 arctic_admiralty: "Arctic Admiralty"
 arctic_admiralty_desc: "The government of Aasakku finds its origin in the curageous pioneers that originally sailed across the vast and frozen sea. Cut off from their peers they resorted to common rulership held in the hands of the most skilled seagoers."