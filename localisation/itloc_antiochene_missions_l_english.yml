l_english:
 NTI_secure_the_imperial_crown_title: "Secure the Imperial Crown"
 NTI_secure_the_imperial_crown_desc: "Ever since Kallinikos, Basileus of Syria, was crowned Emperor of Asia and restored the Empire of Seleukos, it has been the goal of all its Kings to restore his legacy. We must do what we can to ensure that the Empire has the stability it needs, an Antiochene Emperor."

 NTI_control_cappadocia_title: "Control Cappadocia"
 NTI_control_cappadocia_desc: "The fate of the region of Cappadocia has long been of interest to the Basileus of Antiocheia. We must take a more active hand in this and bring the area more firmly into our orbit."

 NTI_recover_southern_anatolia_title: "Recover Southern Anatolia"
 NTI_recover_southern_anatolia_desc: "The regions of Lycia, Pisidia, and Caria are legitimate parts of the Seleukid Empire, but have been lost. We must recover them for the sake of the majesty of the Seleukid dynasty."

 NTI_conquer_anatolia_title: "Conquer Anatolia"
 NTI_conquer_anatolia_desc: "Anatolia is a shattered place state led by weak rulers. The relevant nations of the world, and our own nation foremost, should carve up theirs at the first opportunity."

 NTI_decline_of_armenia_title: "Decline of Armenia"
 NTI_decline_of_armenia_desc: "Armenia's relative decline after the conquests of Ugu Jolobey is a cause for concern. We must tighten our grip on the region to ensure its lands do not fall into hostile hands."

 NTI_royal_armenia_title: "Royal Armenia"
 NTI_royal_armenia_desc: "The Kingdom of Armenia is threatened by dangerous enemies on all sides. We should take advantage of the situation to claim their subjects for ourselves."

 NTI_secure_colchis_title: "Secure Colchis"
 NTI_secure_colchis_desc: "Let us create a military frontier in the old kingdom of Colchis. This way we can fend off anyone who would encroach on Persia"

 NTI_conquer_the_amazons_title: "Conquer the Amazons"
 NTI_conquer_the_amazons_desc: "Amazonia needs to be put under direct Antiochene rule. This will allow us to protect the Hellenic people of the region from the risk of Evenki offensives."

 NTI_home_of_alexander_title: "Home of Alexander"
 NTI_home_of_alexander_desc: "Our empire will never be truly legitimate until we can count the whole of Hellas proper as subject to the [Root.GetStateForm]."

 NTI_imperial_ascendancy_title: "Imperial Ascendancy"
 NTI_imperial_ascendancy_desc: "There are those among the Politeias who would have ambitions to challenge us and seize control of the Empire for themselves. A show of diplomatic and military strength will be necessary to quell these ambitions and ensure that the predominance of our power is undisputed."

 NTI_imperial_border_title: "The Imperial Border"
 NTI_imperial_border_desc: "Some territories of the Empire have lapsed from our rule and are governed by those who do not recognize the Kosmokrator's authority. This situation must be rectified."

 NTI_united_in_religion_title: "United in Religion"
 NTI_united_in_religion_desc: "Tensions between member states have been aggravated by religious differences. We must restore religious unity if we are to regain the moral authority we claim as the "Ordained" Kingdom of Seleukos."

 NTI_a_seleukid_empire_title: "A Seleukid Empire"
 NTI_a_seleukid_empire_desc: "The Ordained Kingdom of Seleukos will never be totally free from ridicule until its borders do indeed include the cities of Pella and Seleukia."

 NTI_pass_imperial_reforms_title: "Pass Imperial Reforms"
 NTI_pass_imperial_reforms_desc: "We must forge the Ordained Kingdom of Seleukos into a large territorial state within which we represent a strong, centralized authority able to enforce a monopoly on violence."

 NTI_balance_the_estates_title: "Balance the Estates"
 NTI_balance_the_estates_desc: "Too often has dissent and division plagued our country. The nobility, clergy and burghers must act as one to achieve the aim of greater glory and prosperity for Austria."

 NTI_antiocheia_prospers_title: "Antiocheia Prospers"
 NTI_antiocheia_prospers_desc: "From the vineyards and manors of the north to the mines and forges of the south, all of Antiocheia shall prosper as our nation increases in strength."

 NTI_imperial_capitals_title: "Imperial Capitals"
 NTI_imperial_capitals_desc: "We must ensure that our provincial capitals reflect our position as the pillar of strength upon which the Ordained Kingdom of Seleukos is based."

 NTI_antiochene_syrtos_title: "The Antiochene Syrtos"
 NTI_antiochene_syrtos_desc: "Our capital of [Root.Capital.GetCapitalName] must flourish and become a city of music and high culture, worthy of a ruler of our standing and a true capital of the Ordained Kingdom of Seleukos."

 NTI_the_cimmerian_question_title: "The Cimmerian Question"
 NTI_the_cimmerian_question_desc: "Cimmeria is at the core of our empire. However, the Cimmerian people are fiercely independent and do not take their subjugation to a foreign power well. If we are to safeguard our stability, we must ensure - one way or another - that the Cimmerian provinces wholeheartedly accept our rule."

 NTI_multicultural_empire_title: "Multicultural Empire"
 NTI_multicultural_empire_desc: "Our expansion to the east and south is bringing increasing numbers of non-German speaking foreigners into our Empire. Our long-term stability depends on our ability to effectively integrate these subject peoples."

 NTI_deal_with_autonomies_title: "Deal with the Autonomies"
 NTI_deal_with_autonomies_desc: "There are a number of weak, autonomous kingdoms on our borders. If we wish to strengthen Antiocheia, these would be easy targets for expansion."

 NTI_kingdom_of_assyria_title: "The Kingdom of Assyria"
 NTI_kingdom_of_assyria_desc: "The Assyrians have long been a troublesome presence on our eastern border. Their wealthy duchy has the potential to be a great thorn in our side. We should secure our borders - and our preeminence - by claiming it for ourselves."

 NTI_control_mesopotamia_title: "Control Mesopotamia"
 NTI_control_mesopotamia_desc: "Mesopotamia includes a variety of estates and territories scattered across various different peoples. We should consolidate these by subduing the surrounding cities and politeias, bringing them under our rule and establishing a bulwark of our power in the west."

 NTI_deal_with_basilto_title: "Deal with Basilto"
 NTI_deal_with_basilto_desc: "Basilto has the potential to become the power base of a state in northern Persia strong enough to challenge us. This challenge must be neutralized if our dominance in Persia is to remain unquestioned."

 NTI_connect_seleukia_title: "Connect Seleukia"
 NTI_connect_seleukia_desc: "Seleukia is cut off from Antiocheia Proper. We should join them up with the rest of our lands."

 NTI_conquer_chaldea_title: "Conquer Chaldea"
 NTI_conquer_chaldea_desc: "We have attempted to annex the Chaldeans before but were thwarted on every occasion - by a simple horse herder with a bow and arrow, in one case. We must overcome the generations of humiliation we have suffered and bring these rebellious farmers under our rule."

 NTI_defeat_the_bosporans_title: "Defeat the Bosporans"
 NTI_defeat_the_bosporans_desc: "The fiercely independent Bosporans occupy a position of strategic importance at our gateway to Eastern Europe. We must flex our muscles and bring them into our empire."

 NTI_push_on_to_the_north_title: "Push on to The North"
 NTI_push_on_to_the_north_desc: "Northern Caucasia and the Pontic Steppe have fallen under Evenki rule. We must reverse their gains and push them back towards the Bosphorus, building up our empire in the Balkans in the process."

 emp_hab_scourge_of_asia_title: "The Scourge of Asia"
 emp_hab_scourge_of_asia_desc: "The Ordained Kingdom of Seleukos will never be safe from invasions until we have completely dealt with the perfidious Armenians."

 NTI_balance_of_power_title: "The Balance of Power"
 NTI_balance_of_power_desc: "We must establish a balance of power in Persia in which our continued preeminence is guaranteed."

 NTI_spread_dynasty_title: "[Root.GetSpreadDynastyOrFallbackMissionTitle]"
 NTI_spread_dynasty_desc: "[Root.GetHABDynastyOrFallbackMissionDesc]"

 NTI_shift_the_balance_title: "Shift the Balance"
 NTI_shift_the_balance_desc: "A balance of power is all very well, but if we can shift it in our favor, we will be well on our way to claiming our rightful position as the preeminent state in all of Europe."

 NTI_crush_the_revolution_title: "[Root.GetEmbraceOrCrushRevolutionMissionTitle]"
 NTI_crush_the_revolution_desc: "[Root.GetEmbraceOrCrushRevolutionMissionDesc]"

 NTI_glory_to_seleukids_title: "[Root.GetGloryToDynastyOrFallbackMissionTitle]"
 NTI_glory_to_seleukids_desc: "Hegemony over Europe is our destiny. We must seize it in both hands and ensure that none are left who do not recognize our superiority."


 NTI_asian_africa_title: "Asian Africa"
 NTI_asian_africa_desc: "The Aegyptian lands are home to many prosperous cities. If we can make them our own, we will be able to give our treasury a significant boost - and put us in a position to entertain ambitions of an overseas empire."
 NTI_erythraean_company_title: "The Erythraean Company"
 NTI_erythraean_company_desc: "The European powers have become fabulously rich via their trading companies in the colonies. Now that we control Egypt, we should seek to get in on the act."
 NTI_indian_trading_title: "Holdings in India"
 NTI_indian_trading_desc: "Our colonial empire will not be complete until it includes substantial holdings in India and the East Indies."
 NTI_foothold_in_china_title: "The Riches of China"
 NTI_foothold_in_china_desc: "Merchants tell of a land of fabulous riches in the far east. We must send our warships and negotiators to ensure that this wealth flows into our pockets."
 NTI_great_southern_land_title: "The Great Southern Land"
 NTI_great_southern_land_desc: "The lands at the far south-east of the known world are open for anyone to take. It is clear that they were meant to be ours."
 NTI_invest_in_the_provinces_title: "Invest in the Provinces"
 NTI_invest_in_the_provinces_desc: "There is much poverty in our Hungarian and Bohemian territories. Our empire would have a far stronger foundation if we were to invest in them as we would in our Austrian territories."
 NTI_erythraean_company_effect_tooltip: "§YAustria§! gains a permanent claim on all coastal level 1 and higher Centers of Trade in §YIndia§! and the §YEast Indies§!."
 NTI_erythraean_company_trigger_tooltip: "Have at least §Y1§! Trade Company."
 NTI_indian_trading_effect_tooltip: "Gain permanent claims on every province in §YIndia§! and §YIndonesia§! that borders on a province owned by §Y[Root.GetName]§!."
 NTI_imperial_border_effect_tooltip: "Every member state of the OKS that is NOT a rival of or rivaled by Antiocheia gains §G10§! trust towards §YAustria§!."
 NTI_imperial_ascendancy_trigger_tooltip: "No OKS member state:\n         §Y10§! or more provinces in §YPersia§! are owned by §Ycountry§! or its by non-tributary subjects.\n         Is NOT subject to §YAntiocheia!."
 NTI_imperial_ascendancy_trigger2_tooltip: " members of the OKS are Free Cities."
 NTI_united_in_religion_trigger_tooltip: "No OKS member state is NOT §Y[Root.Religion.GetName]§!."
 NTI_united_in_religion_effect_remove_tooltip: "This modifier will be removed if Antiocheia is no longer the Kosmokrator of the OKS."
 NTI_pass_imperial_reforms_trigger_tooltip: "Every OKS member state:\n   Opinion of §Y[Root.GetName]§! is at least §Y1§!."
 emp_hab_spread_dynasties_has_dynasty_desc: "The natural place of the Seleukid family is on the throne - as many of them as possible. We must acquire the thrones of Asia for our family."
 emp_hab_spread_dynasties_nodynasty_desc: "Our strength lies in our diplomatic influence as much as in our military strength. We must strengthen our relations with those who can be brought to see the world in much the same way as we do."
 NTI_spread_dynasty_trigger_tooltip: "Countries ruled by members of the §Y[Root.Monarch.Dynasty.GetName]§! dynasty are present on at least §Y5§! continents."
 NTI_spread_dynasty_trigger_tooltip2: " countries (excluding §Y[Root.GetName]§!):\n         Opinion of §Y[Root.GetName]§! is at least §Y120§!\n         One of the following must be true:\n            Governed by the ruler of §Y[Root.GetName]§!\n            Ruling dynasty is '§Y[Root.Monarch.Dynasty.GetName]§!'"
 NTI_shift_the_balance_tooltip: " provinces:\n   Continent is §YEurope§!.\n   Owner:\n      One of the following must be true:\n         Is §Y[Root.GetName]§!.\n         Is a subject of §Y[Root.GetName]§!.\n         Is allied with §Y[Root.GetName]§!.\n         Is the subject of a country allied with §Y[Root.GetName]§!.\n         Is part of the OKS, of which §Y[Root.GetName]§! is the §YKosmokrator§!.\n         Is the subject of a country that is part of the OKS, of which §Y[Root.GetName]§! is the §YKosmokrator§!."
 emp_crush_the_revolution_title: "Crush the Revolution"
 emp_embrace_the_revolution_title: "Embrace the Revolution"
 emp_crush_the_revolution_desc: "Armies of political radicals swarm the streets of the cities of Europe. We cannot abide this disruption of the natural order, and so we must march into the very heart of this Revolution and crush it utterly."
 emp_embrace_the_revolution_desc: "The time of the old order is over - let the new order be forged from the ashes of the old. As political radicals swarm the streets of the cities of Europe, we must join them and utterly crush the tyranny that oppresses humankind."
 NTI_crush_the_revolution_trigger_tooltip: "No country:\n         One of the following is true:\n            Is a §YRevolutionary Republic§!.\n            Is a §YRevolutionary Empire§!."
 emp_mission_power_to_dynasty_title: "Glory to [Root.Monarch.Dynasty.GetName]!"
 emp_mission_power_to_country_title: "Glory to [Root.GetName]!"
 NTI_glory_to_seleukids_trigger_tooltip: "No country:\n   §YCapital§! is on the continent §YEurope§!.\n   Is a Great Power.\n   Is NOT allied with §YAustria§!.\n   Has NOT been defeated by §YAustria§! in war in the past 100 years."
 NTI_glory_to_seleukids_trigger2_tooltip: "No country:\n   §YCapital§! is on the continent §YEurope§!.\n   Has at least §Y300§! total development.\n   Is NOT allied with §YAustria§!.\n   Is NOT a subject of §YAustria§!.\n   Has NOT been defeated by §YAustria§! in war in the past 100 years."
 no_hre_province_owned_by_non_hre_member_or_overlord_trigger: "No Province:\n   Is part of the OKS.\n   One of the following must be true:\n      Is owned by a country not in the OKS.\n      Is owned by a country that is subject to a country not in the OKS."
 hab_austrian_netherlands: "Antiochene Egypt"
 desc_hab_austrian_netherlands: "With Egypt secured, we are well-placed to turn our ambitions towards establishing a colonial empire to equal those of our competitors in Europe."
 hab_victory_over_ottomans: "Armenians Vanquished"
 desc_hab_victory_over_ottomans: "We have vanquished the Armenians, driving their scourge from the shores of Persia. All of the Ecumene appreciates our tireless efforts to achieve this result."
 hab_aeiou_mod: "All Belongs to Antioch"
 desc_hab_aeiou_mod: "We have forged the patchwork of states that made up the Ordained Kingdom of Seleukos into a strong and cohesive power capable of holding its own against the modern states of Europe and Asia - All belongs to Antioch."
 hab_invested_in_provinces: "Provincial Investment"
 desc_hab_invested_in_provinces: "Considerable investment in provincial areas has both increased the prosperity of our territories and convinced the people living in them that the state is dedicated to improving their lot."
 hab_many_thrones: "A Widespread Dynasty"
 desc_hab_many_thrones: "Our dynasty rules many kingdoms and duchies across POersia, giving us a large family network to draw upon to achieve our diplomatic aims."
 hab_lots_of_influence: "Antiochene Influence"
 desc_hab_lots_of_influence: "We have built up significant influence across Persia. There are now a number of states that see the world more or less as we do, giving us a large network to draw upon to achieve our diplomatic aims."
 hab_ascendancy_in_empire: "Ascendancy within the Kingdom"
 desc_hab_ascendancy_in_empire: "We have secured our dominance within the Ordained Kingdom of Seleukos. Complain as they might, the Politeias no longer have the strength to resist us."
 hab_empire_united_in_religion_mod_catholic: "United by Religion"
 desc_hab_empire_united_in_religion_mod_catholic: "The Zoroastrian faith has survived challenges to emerge stronger than ever as the dominant faith of the Ordained Kingdom of Seleukos."
 hab_empire_united_in_religion_mod_protestant: "United by Religion"
 desc_hab_empire_united_in_religion_mod_protestant: "The Katholikos faith has cast off the shackles of Persia and emerged as the dominant faith of the Ordained Kingdom of Seleukos."
 hab_empire_united_in_religion_mod_generic: "United by Religion"
 desc_hab_empire_united_in_religion_mod_generic: "Our faith has overcome all challenges to emerge as the dominant faith of the Ordained Kingdom of Seleukos."
 hab_empire_has_rome: "A Hellenic Empire"
 desc_hab_empire_has_rome: "The Ordained Kingdom of Seleukos is no longer a Hellenic Empire that does not include Pella."
 hab_prosperity_windfall: "Windfalls of Prosperity."
 desc_hab_prosperity_windfall: "The Antiochene economy is experiencing a period of unprecedented prosperity. As a result, our tax collectors are able to collect a substantial windfall for our coffers."
 hab_flourishing_in_empire: "Imperial Cities"
 desc_hab_flourishing_in_empire: "Our focus on the splendor of our cities has attracted much admiration and envy from the Politeias of the Empire."
 hab_balance_of_power_mod: "The Balance of Power"
 desc_hab_balance_of_power_mod: "The balance of power is a delicate thing, which must be carefully maintained to ensure that no power becomes strong enough to challenge us."
 hab_reactionary_zeal: "Reactionary Zeal"
 desc_hab_reactionary_zeal: "The revolution is crushed, and the dangerous ideas it attempted to spread have been nipped in the bud."
 hab_supreme_in_europe: "Supremacy over Persia"
 desc_hab_supreme_in_europe: "There are none left in Persia that do not recognize the superiority of the Seleukid Empire."
 hab_viennese_ballrooms: "Antiochene Courtyards"
 desc_hab_viennese_ballrooms: "The splendour of our courtyards is second to none, offering the nobility from both within and beyond our borders the opportunity to show off their grandeur and attract the attention of the Basileus."
 hab_tolerant_society: "A Multicultural Empire"
 desc_hab_tolerant_society: "We have successfully integrated a number of subject peoples into our country, making them as satisfied by our rule as they would be at rule by one of their own."
 hab_holdings_in_swabia: "Further Antiocheia"
 desc_hab_holdings_in_swabia: "This province is part of the bastion of "Further Antiocheia" that guards the east of Antiocheia's Empire."
 hab_pure_bavarian_beer: "Pure Assyrian Beer"
 desc_hab_pure_bavarian_beer: "Having had millenia to perfect the technique, the beer of the Assyrians is the finest and purest alcohol of all Persia. Now we can enjoy it as our local brew too."
 hab_conquered_serbia: "Conquest of Doros and Tanais"
 desc_hab_conquered_serbia: "We have integrated the Bosporos into our empire and now count the great city of Doros, the ancient colony of Taurica, among our capitals. May it always be a safe haven for our people."
 hab_our_balance_of_power_mod: "Antiocheia Ascendant"
 desc_hab_our_balance_of_power_mod: "In a diplomatic coup that has attracted the attention of all the courts of Persia, we have been able to shift the balance of power so that it is increasingly in our favor."
 hab_chinese_riches: "Chinese Trade"
 desc_hab_chinese_riches: "Our merchants have a monopoly over China, allowing plentiful riches to flow into our coffers."
 hab_austrian_australia: "The Great Southern Land"
 desc_hab_austrian_australia: "Across the ages, many a man and woman shall stumble upon their words when uttering the name of our latest colonial acquisition."
 austrian_dual_monarchy_legacy: "Imperial Antiochene Monarchy"
 austrian_dual_monarchy_legacy_desc: "A governmental form under a monarch which is geared towards keeping a patchwork empire made up of many cultures, cities and territories together."
 austrian_dual_monarchy: "Imperial Antiochene Monarchy"
 austrian_dual_monarchy_desc: "A governmental form under a monarch which is geared towards keeping a patchwork empire made up of many cultures, cities and territories together."
 flavor_hab.20.name: "Reform the Antiochene Imperial Government?"
 flavor_hab.20.desc: "With the growth of the Antiochene Empire, increasing numbers of non-German subjects have had to be integrated into our nation. Until now, we have managed this as best we can, pacifying opposition to our rule; however, many in our provinces still see the [Root.Monarch.GetTitle]s as foreign despots. A radical set of reforms has been put forward to secure the rights of the subject peoples and integrate them into the government in a bid to increase our long-term stability."
 flavor_hab.20.A: "Implement the reforms fully."
 flavor_hab.20.B: "Implement only limited reforms."
