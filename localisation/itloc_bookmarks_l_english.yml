 DUSK_AND_DISUNITY_DESC: "Once again the archipelago stands divided, the north of Akitsushima has been consolidated by Hitakami whilst its central portion is still divided between the princes that rose after the dissolution of the Attecupmosir, in the southeast instead the Kingdom of Yonshu rules the waves between the isles and Honshu."
