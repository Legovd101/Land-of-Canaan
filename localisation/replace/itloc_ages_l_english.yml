# Expansion

 age_of_expansion: "Age of Expansion"
 age_of_expansion_short: "Expansion"
 age_of_expansion_desc: "The world lies in the shadows of many empires both past and present, with new ones rising and falling every day. Can any one polity truly rise above the chaos and consolidate its power?"

