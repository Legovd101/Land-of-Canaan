# Exploration

 age_of_exploration: "Age of Exploration"
 age_of_exploration_short: "Exploration"
 age_of_exploration_desc: "News of land beyond the oceans is spreading like wildfire, with many scrambling to claim its riches for themselves. What will become of this "New World" and the people who live there?"

## Objectives
 itloc_3_continents: "Present on Three Continents"
 itloc_3_continents_desc: "You or your subjects own provinces on a total of at least §Y3§! continents."
 present_on_3_continents_tt: "\nYou or your subjects own provinces on a total of at least §Y3§! continents"
 itloc_colonialism: "Embrace Colonialism"
 itloc_colonialism_desc: "Embrace the Colonialism institution, and keep it in every province you own."
 itloc_pragmatic_expulsions: "Pragmatic Expulsions"
 itloc_pragmatic_expulsions_desc: "Expel at least 2 minorities"
