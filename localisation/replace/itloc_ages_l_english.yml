 itloc_colonial_empire_desc: "Have at least 2 colonial subjects."
 itloc_secure_the_capital: "Secure the Capital"
 itloc_secure_the_capital_desc: "Have either a level 4 fort or a State House in the Capital."
 itloc_riches_of_the_world: "Riches of the World"
 itloc_riches_of_the_world_desc: "Gain the trade bonus from either String Instruments, Chocolate, Cigars, Oprics, Jewellery, Woodworking, or Leather."
