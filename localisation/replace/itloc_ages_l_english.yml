 age_of_revolutions_short: "Revolutions"
 age_of_revolutions_desc: "The advent of gunpowder has democratised warfare, allowing any wanton upstart to declare their own rule with the right amount of firepower. Will order prevail, or shall the great powers of the world fall to chaos and infighting?"

