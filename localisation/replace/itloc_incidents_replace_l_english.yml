 incident_great_peasants_war: "The Fate of the Peasantry"
 incident_great_peasants_war_member_alert: "The violent conflict between the peasantry and the establishment has raged for decades within the Ordained Kingdom of Seleukos. It is time for the Emperor to enforce a firm and final resolution: to protect the rights of the peasantry or to impose the control of the nobility."
 incident_great_peasants_war_emperor_alert: "The violent conflict between the peasantry and the establishment has raged for decades within the Ordained Kingdom of Seleukos. It is time for the Emperor to enforce a firm and final resolution: to protect the rights of the peasantry or to impose the control of the nobility."

 # Shadow Kingdom
 shadow_kingdom_warning_tt: "§YThe Emperor can rein in Bactrian states by defeating them in any war, making them a Polis, or by securing an alliance or strong relations with them.§!"
 shadow_kingdom.2.d: "While Bactria is still formally part of the Ordained Kingdom of Seleukos it has in many ways turned into a 'Shadow Kingdom', with the Bactrian states acting independently of the Emperor. The failure of successive Emperors to restore Imperial authority in the region has also left large areas under the control of states that outright reject Imperial Authority.\nBy now the question for many Bactrian states is why they should allow the Emperor any authority over their lands."
 shadow_kingdom.2.a: "It is time to abandon Bactria."
 shadow_kingdom.2.b: "We must rein in Bactria."
 shadow_kingdom_emperor_gives_up_tt: "§YEastern nations within the HRE that have been reined in will remain in the Empire.§!\n§YEastern nations that have not been reined in will leave the Empire.§!\n\n§YThe Emperor will lose §R0.2§! Imperial Authority per province development which leaves the Empire.§!"
 shadow_kingdom_incident_tt: "§YThe Emperor has until the year 1490 to rein in as many Bactrian nations in the Empire as possible.§!"
 shadow_kingdom_incident_penalty_tt: "Lose §R0.2§! Imperial Authority per §YDevelopment§! from the Bactrian provinces which leave the Ordained Kingdom of Seleukos."
 shadow_kingdom.3.t: "The Shadow Kingdom"
 shadow_kingdom.3.d: "Despite the Imperial resolution to rein in Bactria, there are still Bactrian states that refuse to accept the supremacy of the Empire. [Root.GetAdjective] efforts have not been completely in vain however; those states that have been reined in will not dare defy the Empire again."
 shadow_kingdom.3.a: "The fate of Bactria is decided."
 shadow_kingdom_triggered_modifier_tt: "§Y[Root.GetName] will suffer penalties to Prestige, Unrest, and Stability Cost while it remains within the Empire, unless allied to the Emperor.§!"
 shadow_kingdom_result_ia_tooltip: "§Y[Root.GetName]§! will gain §Y5§! Imperial Authority for each Bactrian nation that remains in the Empire due to being reined in.\n§Y[Root.GetName]§! will lose §Y10§! Imperial Authority for each independent Bactrian nation that we did not rein in."
 shadow_kingdom.4.d2: "As promised, the Emperor launched a campaign to restore Imperial authority to Bactria. [Root.GetName] was among the states that were forced to accept the rule of the Empire, and our submission is proof that the Emperor’s word is law."
 shadow_kingdom_decision_title: "Rein in Bactria"
 shadow_kingdom_decision_desc: "The Bactrian Princes must be reined in either through diplomacy or war. We cannot allow Bactria to become a shadow kingdom!"
 shadow_kingdom_will_leave_info_decision_tt: "§YHas not been reined in and may leave the Empire§!"
 has_reined_in_all_italians_early: "All §YEastern§! Princes have been reined in.\n\n§YReining§! means that the §YTarget§! country must fulfill at least one of the following conditions:\n    §YTarget's§! opinion of §Y[Root.GetName]§! is at least §G150§!.\n    Has the §YFree City§! Government Reform.\n    Is a Subject of §Y[Root.GetName]§!.\n    §YTarget§! is allied with §Y[Root.GetName]§!.\n    Has been defeated by §YEmperor§! in a War."

 # Anatolia incident
 anatolia.1.t: "The Question of Anatolia"
 anatolia.1.d: "Though Anatolia has long been ruled under the suzerainty of the Emperor, but it has since fallen out of the imperial grasp. While the Emperor has been content for the Serican Captaincies to rule over the region, it remains a legal part of the Empire and most emphatically not an independent Serican place."
 anatolia.1.a: "A direct intervention by the Emperor is best!"
 anatolia.1.b: "We should collaborate with the remaining Hellenic states in the region."
 anatolia.1.c: "Perhaps the Captaincies can be courted?"

 anatolia.2.t: "Offer of Suzerainty from [From.GetName]"
 anatolia.2.d: "Though Anatolia has long been ruled under the suzerainty of the Emperor, but it has since fallen out of the imperial grasp. While the Emperor has been content for the Serican Captaincies to rule over the region, they claim that it remains a legal part of the Empire and most emphatically not an independent Serican place."
 anatolia.2.a: "We will comply with the Emperor's demand."
 anatolia.2.b: "Anatolia is ours by right."

 anatolia.3.t: "The Question of Anatolia"
 anatolia.3.d: "Though Anatolia has long been ruled under the suzerainty of the Emperor, but it has since fallen out of the imperial grasp. While the Emperor has been content for the Serican Captaincies to rule over the region, it remains a legal part of the Empire and most emphatically not an independent Serican place."
 anatolia.3.a: "This matter requires deliberation."
