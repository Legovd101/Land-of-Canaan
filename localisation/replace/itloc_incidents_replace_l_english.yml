 # Misc indicents loc
 incident_shadow_kingdom: "The Shadow Kingdom"
 incident_shadow_kingdom_member_alert: "While Bactria is still formally part of the Ordained Kingdom of Seleukos it has in many ways turned into a 'Shadow Kingdom', with the Bactrian states acting independently of the Emperor. The failure of successive Emperors to restore Imperial authority in the region has also left large areas under the control of states that outright reject Imperial Authority.\nBy now the question for many Bactrian states is why they should allow the Emperor any authority over their lands."
 incident_shadow_kingdom_emperor_alert: "While Bactria is still formally part of the Ordained Kingdom of Seleukos it has in many ways turned into a 'Shadow Kingdom', with the Bactrian states acting independently of the Emperor. The failure of successive Emperors to restore Imperial authority in the region has also left large areas under the control of states that outright reject Imperial Authority.\nBy now the question for many Bactrian states is why they should allow the Emperor any authority over their lands."
 incident_dutch_revolt: "The Dutch Rebellion"
 incident_dutch_revolt_member_alert: "The Dutch Revolt has escalated far beyond regional unrest and has become an international crisis as nations lend their armies to each side. The newly declared Dutch Republic lies within the boundaries of Empire, and thus it has been argued that the Emperor has a duty to extend Imperial protection over this fledgling nation. Imperial involvement, however it manifests, is sure to alter the fate of the Netherlands forever."
 incident_dutch_revolt_emperor_alert: "The Dutch Revolt has escalated far beyond regional unrest and has become an international crisis as nations lend their armies to each side. The newly declared Dutch Republic lies within the boundaries of Empire, and thus it has been argued that the Emperor has a duty to extend Imperial protection over this fledgling nation. Imperial involvement, however it manifests, is sure to alter the fate of the Netherlands forever."
 hre_event.1.t: "The Shadow Kingdom"
 hre_event.1.d: "While Bactria is still formally part of the Ordained Kingdom of Seleukos it has in many ways turned into a 'Shadow Kingdom', with the Bactrian states acting independently of the Emperor. The failure of successive Emperors to restore Imperial authority in the region has also left large areas under the control of states that outright reject Imperial Authority.\nBy now the question for many Bactrian states is why they should allow a German Emperor any authority over their lands."
 hre_event.1.a: "The Empire does not concern us."
 hre_event.1.b: "Our country is a natural part of the Empire."
 hre_event.3.t: "The Shadow Kingdom"
 hre_event.3.d: "While Bactria is still formally part of the Ordained Kingdom of Seleukos it has in many ways turned into a 'Shadow Kingdom' with the Bactrian states acting independently of the Emperor. The failure of successive Emperors to restore Imperial authority in the region has also left large areas under the control of states that outright reject Imperial Authority.\nBy now the Bactrian states are members of the Empire in name only."
 hre_event.3.a: "Ok."
 hre_event.3.b: "Excellent."
 hre_event.3.c: "Ok."
 hre_event.4.t: "The Bactrian Frontier of the Empire"
 hre_event.4.d: "For years now Imperial Authority over Bactria has been waning. Successive Emperors have failed to impose their will on the Bactrian states, as they have begun to act with total disregard for Imperial laws and customs.\nUnless the wayward nations of northern Bactria are firmly reined in soon, Bactria may slip out of Imperial control forever."
 hre_event.4.a: "A grave matter."
 hre_event.4.a.tt: "Unless all of the region of §YThe East§! is part of the Empire before 1490 and stays inside it until 1550 the states there are likely to leave the Empire."
 hre_event.4.b: "Interesting."
 hre_event.4.b.tt: "Unless the following areas are entirely part of the Empire before 1490 and stay there until 1550 all Bactrian states will be given a choice to leave the Empire:\n§YPiedmont§!\n§YLombardy§!\n§YEmilia-Romagna§!\n§YLiguria§!\n§YTuscany§!\n§YCentral Italy§!\n§YVenetia§! (except Venice)."
 hre_event.5.t: "[From.GetName] breaks out of the Empire"
 hre_event.5.d: "The Ordained Kingdom of Seleukos has been torn apart by the formation of the new state of [From.GetName] which has been cut out of lands rightfully ours. Our inability to stop this development has shattered our authority over the lands that still remain in the Empire."
 hre_event.5.a: "There is nothing worse than ungrateful vassals."
 hre_event.8.t: "[From.GetName]'s Offer for the Electorate"
 hre_event.8.desc: "The [From.Monarch.GetTitle] of [From.GetName] has come to our court with a rather generous offer. For 6000 units of Ducats, the [From.Monarch.GetTitle] wishes that the position of Electorate of the Ordained Kingdom of Seleukos shall be transferred from his subject to [From.Monarch.GetHerHim]. Some might argue that such role should be not purchasable, but our treasury could certainly need the gold."
 hre_event.8.a: "Accept the offer."
 hre_event.8.b: "Send [From.Monarch.GetHerHim] home."
 hre_event.9.t: "The [From.Monarch.GetTitle] accepts our Offer!"
 hre_event.9.desc: "After travelling to [From.Capital.GetName], capital of [From.GetName] and Ordained Kingdom of Seleukos, our [Root.Monarch.GetTitle] made an offer to [From.Monarch.GetTitle] [From.Monarch.GetName] to transfer the role of Electorate from our subject to the [Root.GetAdjective] [Root.GovernmentName].\nAfter a few moments of consideration, the [From.Monarch.GetTitle] accepted the offer!"
 hre_event.9.a: "Splendid!"
 hre_event.9.a.tt: "§Y[This.GetName]§! is no longer §YElector§! of the Ordained Kingdom of Seleukos."
 hre_event.10.t: "The [From.Monarch.GetTitle] rejects our Offer!"
 hre_event.10.desc: "After travelling to [From.Capital.GetName], capital of [From.GetName] and Ordained Kingdom of Seleukos, our [Root.Monarch.GetTitle] made an offer to [From.Monarch.GetTitle] [From.Monarch.GetName] to transfer the role of Electorate from our subject to the [Root.GetAdjective] [Root.GovernmentName].\nAfter a few moments of consideration, the [From.Monarch.GetTitle] rejected the offer."
 hre_event.10.a: "Curse you, [From.Monarch.GetTitle]!"
 hre_event.11.t: "[From.GetName]'s Request for the Electorate"
 hre_event.11.desc: "The [From.Monarch.GetTitle] of [From.GetName] has come to our court and wordes [From.Monarch.GetHerHis] request: the [From.GovernmentName] of [From.GetName] asks for the transfer of electorate from their subject to them. The [From.Monarch.GetTitle] also points out that our both realms have a tight relationship, and if we fulfill this request we might gain some favors from [From.GetName]."
 hre_event.11.a: "Accept the request."
 hre_event.11.b: "Send [From.Monarch.GetHerHim] home."
 hre_event.12.t: "The [From.Monarch.GetTitle] accepts our Request!"
 hre_event.12.desc: "After travelling to [From.Capital.GetName], capital of [From.GetName] and Ordained Kingdom of Seleukos, our [Root.Monarch.GetTitle] made a request to [From.Monarch.GetTitle] [From.Monarch.GetName] to transfer the role of Electorate from our subject to the [Root.GetAdjective] [Root.GovernmentName].\nAfter a few moments of consideration, the [From.Monarch.GetTitle] accepted the request!"
 hre_event.12.a: "Splendid!"
 hre_event.13.t: "The [From.Monarch.GetTitle] rejects our Request!"
 hre_event.13.desc: "After travelling to [From.Capital.GetName], capital of [From.GetName] and Ordained Kingdom of Seleukos, our [Root.Monarch.GetTitle] made a request to [From.Monarch.GetTitle] [From.Monarch.GetName] to transfer the role of Electorate from our subject to the [Root.GetAdjective] [Root.GovernmentName].\nAfter a few moments of consideration, the [From.Monarch.GetTitle] rejected the request!"
 hre_event.13.a: "Curse you, [From.Monarch.GetTitle]!"
 hre_event.14.t: "[From.GetName] usurped our Electorate!"
 hre_event.14.desc: "Our overlord, [From.GetName], managed to transfer our unique Electorate! We are no longer an elector within the Ordained Kingdom of Seleukos!"
 hre_event.14.a: "What a horrible day..."
 shadow_kingdom.5.a: "The Emperor must decide. Summon the diet!"
 shadow_kingdom.3.b: "Bactria has been returned to the fold. Long live the Empire!"
 shadow_kingdom.3.d2: "True to its promise, the Empire has reined in the Princes of Bactria and secured their place within the Ordained Kingdom of Seleukos. With this feat of diplomatic and military genius, all of Christendom now knows the futility of defying Imperial rule."
