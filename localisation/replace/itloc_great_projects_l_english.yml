l_english:
 alexandrian_ziggurat: "Alexandrian Ziggurat"
 alexandrian_ziggurat_desc: "“Here too is the tomb of Belus, now flourishing, having been restored by Alexander after its demolition by Xerxes, as it is said. It is a quadrangular pyramid of baked brick, not only being a stadium in height, but also having sides a stadium in length. Alexander set about to repair this pyramid. It was a large task and required a long time (for merely the clearing away of the mound was a task for ten thousand men for two months; the total construction), so that he could not finish what he had attempted; for immediately the king was overtaken by disease and death. Seleucus cared for this matter; and continued Alexander's grand plans for Babylon.” \n\n~Strabo's Geographica"
 port_of_tyre: "Port of Tyre"
 port_of_tyre_desc: "“But Tyre is wholly an island, being built up nearly in the same way as Aradus; and it is connected with the mainland by a mole, which was constructed by Alexander when he was besieging it; and it has two harbours, one that can be closed and the other, called “Aegyptian” harbour, open. The houses here, it is said, have many stories, even more than the houses at Rome, and on this account, when an earthquake took place, it lacked but little of utterly wiping out the city. The city was also unfortunate when it was taken by siege by Alexander; but it overcame such misfortunes and restored itself both by means of the seamanship of its people, in which the Phoenicians in general have been superior to all peoples of all times.” \n\n~Strabo's Geographica"
 grand_nuraghe: "Grand Nuraghe"
 grand_nuraghe_desc: "“After Aristaeus the Iberians crossed to Sardinia, under Norax as leader of the expedition, and they founded the city of Nora. The tradition is that this was the first city in the island, and they say that Norax was a son of Erytheia, the daughter of Geryones, with Hermes for his father. To this day Nora remains the site of a large fortress which the Iolei posit was built by Norax himself.” \n\n~Pausanias' Descriptio Graeciae"
 pantheon: "Pantheon"
 pantheon_desc: "“Agrippa finished the construction of the building called the Pantheon. It has this name, perhaps because it received among the images which decorated it the statues of many gods, including Mars and Venus; but my own opinion of the name is that, because of its vaulted roof, it resembles the heavens.” \n\n~Cassius Dio's Historia Romana"
 palace_of_graecus: "Palace of Graecus Albanus"
 palace_of_graecus_desc: "“The false dictator had constructed for himself a grand complex in Thessalonica, rivaling those of the Greeks at the time and even the Persians before them.” \n\n~Cassius Dio's Historia Romana"
 temple_of_bel: "Temple of Bel"
 temple_of_bel_desc: "“... and made for him ... an equestrian statue, a statue in the house of Bel, a statue of bronze, and also, with the honor of the council and the people, the four tribes made for him, each tribe in the house of their god, a statue of bronze in his honor, because he did good ... in the month Kanun, the year 483.” \n\n~A Palmyrene inscription in the Temple of Bel"
 hatra_complex: "Hatra Complex"
 hatra_complex_desc: "“May Shamashaqab son of Hanina, the architect, be remembered for good, for he has built this temple for the god Nabu for the life of his sons ... all of them.” \n\n~An inscription in the temple of Nabu"
 lighthouse_of_alexandria: "Lighthouse of Alexandria"
 lighthouse_of_alexandria_desc: "“There is another building, too, that is highly celebrated; the tower that was built by a king of Egypt, on the island of Pharos, at the entrance to the harbour of Alexandria. The cost of its erection was eight hundred talents, they say; and, not to omit the magnanimity that was shown by King Ptolemæus on this occasion, he gave permission to the architect, Sostratus of Cnidos, to inscribe his name upon the edifice itself. The object of it is, by the light of its fires at night, to give warning to ships, of the neighbouring shoals, and to point out to them the entrance of the harbour. At the present day, there are similar fires lighted up in numerous places, Ostia and Ravenna, for example. The only danger is, that when these fires are thus kept burning without intermission, they may be mistaken for stars, the flames having very much that appearance at a distance. This architect is the first person that built a promenade upon arches; at Cnidos, it is said.” \n\n~Pliny the Elder's Naturalis Historia"
 kaaba_of_najran: "Kaaba of Najran"
 kaaba_of_najran_desc: "“The Kaaba of Najran is a must for you, until you kneel at its gates\n\nWe visit Yazid, 'Abd al-Masih and Qays, who are the best of his lords\n\nWe contemplated the flowers and the jasmin, as well as the musicians with their flutes” \n\n~A poem by Maymun Ibn Qays Al-A'sha"
 kaaba: "Kaaba of Mecca"
 kaaba_desc: "“I swore by the House circumambulated by,\n\nits builders, Quraysh and Jurhum,\n\nand by al-Lat and al-'Uzza whom they worship\n\nat Mecca, at the noble inviolable House” \n\n~Zuhayr ibn Abi Sulma in the Mu'allaqat"
 port_of_muscat: "Port of Muscat"
 port_of_muscat_desc: "“... beyond this is a port established for receiving the Sachalitic frankincense; the harbor is called Moscha, and ships from Cana call there regularly; and ships returning from Damirica and Barygaza, if the season is late, winter there, and trade with the King's officers, exchanging their cloth and wheat and sesame oil for frankincense, which lies in heaps all over the Sachalitic country, open and unguarded, as if the place were under the protection of the gods; for neither openly nor by stealth can it be loaded on board ship without the King's permission; if a single grain were loaded without this, the ship could not clear from the harbor.” \n\n~Períplous tis Erythrâs Thalássis"
 pyramids_of_meroe: "Pyramids of Meroë"
 pyramids_of_meroe_desc: "“Year 6, under the Majesty of the Horus the Two Ladies, the Golden Horus, the King of Upper and Lower Egypt, Rab son of Re, Taharqo, living forever, beloved of Maat, to whom Amun has given Maat, may he live forever. As His Majesty is the one who loves the god, he spends the day and lies by night seeking what is useful to the gods, building their temples fallen into decay, giving birth to their statues as in the primeval times, building their storehouses, endowing altars, presenting them with offerings of any product, making their offering tables of fine gold, silver, copper.” \n\n~A stele from Gematon"
 petra_desc: "“Whatever he receives of silver or gold or offerings or provisions of any kind, or of silver (coinage) or bronze (coinage) ... and the other half (will be allotted) to the priests after the carrying out of a proclamation of delinquency before this (time). Then there shall be allotted ... concerning it, whoever does other than all of what is written above shall as a consequence repay that which was found out ...” \n\n~An inscription from Petra"
 gates_of_alexander: "Gates of Alexander"
 gates_of_alexander_desc: "“Ecbatana, the capital of Media, was built by king Seleucus, at a distance from Great Seleucia of one hundred and twenty stadia, and three stadia from the Caspian Gates. The remaining towns of the Medians are Phazaca, Aganzaga, and Apamea, surnamed Rhagiane. The reason of these passes receiving the name of “Gates,” is the same that has been stated above. The chain of mountains is suddenly broken by a passage of such extreme narrowness that, for a distance of eight miles, a single chariot can barely find room to move along: the whole of this pass has been formed by artificial means.” \n\n~Pliny the Elder's Naturalis Historia"
 city_of_sanaa: "City of Sana'a"
 city_of_sanaa_desc: "“... and after that, they went back to the city of San'a, so that messengers from Gumdan reached them in submission and with pledge; and they gave their children as firm pledges, and they belonged to the king of Saba' and to the city of Laqah, for they gave firm pledges and their peace-offerings. And that 'Ilumquh Tahwan, master of 'Awwam, may continue to assist them in humiliating and crushing and breaking down and withering their every foe and enemy.” \n\n~An inscription in the Temple of Awwam
"