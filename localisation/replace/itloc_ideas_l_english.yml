 memories_of_themiscyra: "Memories of Themiscyra"
 memories_of_themiscyra_desc: "Though it has been long since our Queen held her rightful place in the halls of Themiscyra, the legacy of our once-home fills the steppe's children with a longing for what once was, as well as solidifies our rule over the Pontic Steppe."
 warriors_of_myth: "Warriors of Myth"
 warriors_of_myth_desc: "Throughout all of our history, from the time we first saddled a steed, to this day and age, we have foremost been warriors. Unrivaled masters of the horse. The horsewomen of Scythia have had their songs sung from the Crimea to distant Arabia, rivaling the fame of even Alexander himself."
 manslayers: "Manslayers"
 manslayers_desc: ""
 northern_iranics: "Northern Iranics"
 northern_iranics_desc: "While we have long been influenced by the nomads of the steppe, the Greeks with whom we have long traded, the Caucasians to our south, and even the distant Evenks on their warpath, we have not forgotten our identity. Our roots lie within Iran."
