 PRU_evenki_warbands: "Roaming Evenki Warbands"
 PRU_evenki_warbands_desc: "“The death of Ugu had left them purposeless, as they found themselves neither content to settle down with their spoils, nor to wander aimlessly through the Steppes...”"
 PRU_amber_mines: "Capital Punishment"
 PRU_amber_mines_desc: "“Many would-be usurpers would rise up against my rule. But what to do with them? I could not bring myself to execute every traitor, so I sent them to work in the amber mines for ten years before granting them their freedom once more.”"
 PRU_integrate_balts: "Integrating the Baltic Chieftains"
 PRU_integrate_balts_desc: "“...for as much as I hated to admit, the Balti resented me for simply not being one of them, and I could never make myself one of them, not fully. However, I began to take what steps I could to ingratiate myself with the local tribes: speaking their language, wearing their clothes, taking part in their festivals, and engaging with their customs...”"
 PRU_intellectual_guidance: "Intellectual Guidance"
 PRU_intellectual_guidance_desc: "“Being well-versed in the ethics of rule from both the East and the West, I did my best to employ and exemplify the best of both worlds in how I controlled the Balti, showing mercy to the vulnerable, and strength to my detractors.”"
