l_english:
 hab_austrian_netherlands: "Antiochene Egypt"
 desc_hab_austrian_netherlands: "With Egypt secured, we are well-placed to turn our ambitions towards establishing a colonial empire to equal those of our competitors in Europe."
 hab_victory_over_ottomans: "Armenians Vanquished"
 desc_hab_victory_over_ottomans: "We have vanquished the Armenians, driving their scourge from the shores of Persia. All of the Ecumene appreciates our tireless efforts to achieve this result."
 hab_aeiou_mod: "All Belongs to Antioch"
 desc_hab_aeiou_mod: "We have forged the patchwork of states that made up the Ordained Kingdom of Seleukos into a strong and cohesive power capable of holding its own against the modern states of Europe and Asia - All belongs to Antioch."
 hab_invested_in_provinces: "Provincial Investment"
 desc_hab_invested_in_provinces: "Considerable investment in provincial areas has both increased the prosperity of our territories and convinced the people living in them that the state is dedicated to improving their lot."
 hab_many_thrones: "A Widespread Dynasty"
 desc_hab_many_thrones: "Our dynasty rules many kingdoms and duchies across POersia, giving us a large family network to draw upon to achieve our diplomatic aims."
 hab_lots_of_influence: "Antiochene Influence"
 desc_hab_lots_of_influence: "We have built up significant influence across Persia. There are now a number of states that see the world more or less as we do, giving us a large network to draw upon to achieve our diplomatic aims."
 hab_ascendancy_in_empire: "Ascendancy within the Kingdom"
 desc_hab_ascendancy_in_empire: "We have secured our dominance within the Ordained Kingdom of Seleukos. Complain as they might, the Politeias no longer have the strength to resist us."
 hab_empire_united_in_religion_mod_catholic: "United by Religion"
 desc_hab_empire_united_in_religion_mod_catholic: "The Zoroastrian faith has survived challenges to emerge stronger than ever as the dominant faith of the Ordained Kingdom of Seleukos."
 hab_empire_united_in_religion_mod_protestant: "United by Religion"
 desc_hab_empire_united_in_religion_mod_protestant: "The Katholikos faith has cast off the shackles of Persia and emerged as the dominant faith of the Ordained Kingdom of Seleukos."
 hab_empire_united_in_religion_mod_generic: "United by Religion"
 desc_hab_empire_united_in_religion_mod_generic: "Our faith has overcome all challenges to emerge as the dominant faith of the Ordained Kingdom of Seleukos."
 hab_empire_has_rome: "A Hellenic Empire"
 desc_hab_empire_has_rome: "The Ordained Kingdom of Seleukos is no longer a Hellenic Empire that does not include Pella."
 hab_prosperity_windfall: "Windfalls of Prosperity."
 desc_hab_prosperity_windfall: "The Antiochene economy is experiencing a period of unprecedented prosperity. As a result, our tax collectors are able to collect a substantial windfall for our coffers."
 hab_flourishing_in_empire: "Imperial Cities"
 desc_hab_flourishing_in_empire: "Our focus on the splendor of our cities has attracted much admiration and envy from the Politeias of the Empire."
 hab_balance_of_power_mod: "The Balance of Power"
 desc_hab_balance_of_power_mod: "The balance of power is a delicate thing, which must be carefully maintained to ensure that no power becomes strong enough to challenge us."
 hab_reactionary_zeal: "Reactionary Zeal"
 desc_hab_reactionary_zeal: "The revolution is crushed, and the dangerous ideas it attempted to spread have been nipped in the bud."
 hab_supreme_in_europe: "Supremacy over Persia"
 desc_hab_supreme_in_europe: "There are none left in Persia that do not recognize the superiority of the Seleukid Empire."
 hab_viennese_ballrooms: "Antiochene Courtyards"
 desc_hab_viennese_ballrooms: "The splendour of our courtyards is second to none, offering the nobility from both within and beyond our borders the opportunity to show off their grandeur and attract the attention of the Basileus."
 hab_tolerant_society: "A Multicultural Empire"
 desc_hab_tolerant_society: "We have successfully integrated a number of subject peoples into our country, making them as satisfied by our rule as they would be at rule by one of their own."
 hab_holdings_in_swabia: "Further Antiocheia"
 desc_hab_holdings_in_swabia: "This province is part of the bastion of "Further Antiocheia" that guards the east of Antiocheia's Empire."
 hab_pure_bavarian_beer: "Pure Assyrian Beer"
 desc_hab_pure_bavarian_beer: "Having had millenia to perfect the technique, the beer of the Assyrians is the finest and purest alcohol of all Persia. Now we can enjoy it as our local brew too."
 hab_conquered_serbia: "Conquest of Doros and Tanais"
 desc_hab_conquered_serbia: "We have integrated the Bosporos into our empire and now count the great city of Doros, the ancient colony of Taurica, among our capitals. May it always be a safe haven for our people."
 hab_our_balance_of_power_mod: "Antiocheia Ascendant"
 desc_hab_our_balance_of_power_mod: "In a diplomatic coup that has attracted the attention of all the courts of Persia, we have been able to shift the balance of power so that it is increasingly in our favor."
 hab_chinese_riches: "Chinese Trade"
 desc_hab_chinese_riches: "Our merchants have a monopoly over China, allowing plentiful riches to flow into our coffers."
 hab_austrian_australia: "The Great Southern Land"
 desc_hab_austrian_australia: "Across the ages, many a man and woman shall stumble upon their words when uttering the name of our latest colonial acquisition."
 austrian_dual_monarchy_legacy: "Imperial Antiochene Monarchy"
 austrian_dual_monarchy_legacy_desc: "A governmental form under a monarch which is geared towards keeping a patchwork empire made up of many cultures, cities and territories together."
 austrian_dual_monarchy: "Imperial Antiochene Monarchy"
 austrian_dual_monarchy_desc: "A governmental form under a monarch which is geared towards keeping a patchwork empire made up of many cultures, cities and territories together."
 flavor_hab.20.name: "Reform the Antiochene Imperial Government?"
 flavor_hab.20.desc: "With the growth of the Antiochene Empire, increasing numbers of non-German subjects have had to be integrated into our nation. Until now, we have managed this as best we can, pacifying opposition to our rule; however, many in our provinces still see the [Root.Monarch.GetTitle]s as foreign despots. A radical set of reforms has been put forward to secure the rights of the subject peoples and integrate them into the government in a bid to increase our long-term stability."
 flavor_hab.20.A: "Implement the reforms fully."
 flavor_hab.20.B: "Implement only limited reforms."
